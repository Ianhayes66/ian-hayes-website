<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Rovvy App Review Recording</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #071a2d;
      }

      main {
        width: min(92vw, 520px);
        padding: 28px 0;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 22px;
        letter-spacing: 0;
      }

      video {
        display: block;
        width: 100%;
        max-height: 82vh;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 8px;
        background: #000;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Rovvy App Review Recording</h1>
      <video controls playsinline preload="metadata">
        <source src="rovvy-safety-review.mp4" type="video/mp4" />
        Your browser does not support HTML video playback.
      </video>
    </main>
  </body>
</html>
